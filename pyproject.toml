[project]
name = "mcp-gtags-server"
version = "2.0.0"
description = "Indexed code navigation for AI coding agents — replace grep scans with GNU Global (gtags) lookups over MCP. ~100x faster and radically less noise on million-line C/C++ codebases."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Harshith Sunku" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "gtags",
    "gnu-global",
    "code-navigation",
    "code-search",
    "ai-agents",
    "claude",
    "c",
    "c++",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # >=2.2: the MCPServer API (Context injection, run(host=, port=),
    # add_notification_handler) this server is written against. <3: a new SDK
    # major removed the server class once already (2.0 dropped FastMCP) and
    # every fresh `uvx` install resolves the newest release — keep it capped.
    "mcp>=2.2.0,<3",
    "anyio>=4.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/harshithsunku/mcp-gtags-server"
Repository = "https://github.com/harshithsunku/mcp-gtags-server"
Issues = "https://github.com/harshithsunku/mcp-gtags-server/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Validates the Agent Plugins manifests against the vendored schemas.
    "jsonschema>=4.0",
]

[project.scripts]
mcp-gtags-server = "gtags_mcp.server:main"
# Legacy alias — kept so existing MCP client configs keep working.
gtags-mcp = "gtags_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtags_mcp"]

[tool.pytest.ini_options]
# pytest resets warning filters per test, overriding the module-level filter
# in gtags_mcp.server that keeps the SDK's roots-deprecation notice quiet.
filterwarnings = [
    "ignore:The roots capability is deprecated:mcp.shared.exceptions.MCPDeprecationWarning",
]
